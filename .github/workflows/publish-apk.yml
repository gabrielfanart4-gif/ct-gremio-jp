name: Publicar APK validado

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ct-gremio-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar e publicar o APK com integridade verificada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = 'gabrielfanart4-gif/ct-gremio-jp'
          assert os.environ['GH_REPO'] == repo
          tag = 'v1.0.0-25'
          expected_sha = '761cb8b22cdc945557d1e269c9b2f7817ad882675e3dc56e7e94da25c138405d'
          expected_size = 108799475
          source = 'https://expo.dev/artifacts/eas/blfV11L5jnybNU1qzZeFy0Ao-NAZIPSI0XO4pkkbNdE.apk'
          filename = Path('ct-gremio-jp.apk')
          digest = hashlib.sha256()
          subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--retry', '2', source, '--output', str(filename)], check=True)
          with filename.open('rb') as downloaded:
              while True:
                  chunk = downloaded.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
          assert filename.stat().st_size == expected_size, 'Unexpected APK size'
          assert digest.hexdigest() == expected_sha, 'APK checksum mismatch'
          notes = Path('release-notes.md')
          notes.write_text(
              'Atualização CT Grêmio JP — versão 1.0.0 (25)\n\n'
              '- Correção do contador de mensagens: apenas recebidas e ainda não lidas pela própria conta.\n'
              '- Nome CT GREMIO JP no aplicativo Android e na instalação web.\n'
              '- Identidade e títulos atualizados também nos sites do clube.\n\n'
              'Pacote br.com.ctgremio.app, Android 7 ou superior. Assinatura original conferida para atualizar a instalação oficial anterior.\n\n'
              'Compilação, assinatura, recursos da logo e alinhamento de 16 KB verificados. Teste em aparelho físico não realizado neste ambiente.\n\n'
              'SHA-256 do APK: ' + expected_sha + '\n'
          )
          api_path = 'repos/' + repo + '/releases'
          def releases_for_tag():
              result = subprocess.run(['gh', 'api', api_path], capture_output=True, text=True, check=True)
              return [release for release in json.loads(result.stdout) if release['tag_name'] == tag]
          releases = releases_for_tag()
          assert len(releases) <= 1, 'Multiple releases with the same tag require review'
          if not releases:
              subprocess.run(['gh', 'release', 'create', tag, str(filename), '--repo', repo, '--draft', '--title', 'CT Grêmio JP 1.0.0 (25)', '--notes-file', str(notes)], check=True)
              releases = releases_for_tag()
          assert len(releases) == 1, 'Could not locate the release'
          release = releases[0]
          release_path = api_path + '/' + str(release['id'])
          if not release['assets']:
              assert release['draft'], 'Existing published release has no APK'
              subprocess.run(['gh', 'release', 'upload', tag, str(filename), '--repo', repo], check=True)
          result = subprocess.run(['gh', 'api', release_path], capture_output=True, text=True, check=True)
          release = json.loads(result.stdout)
          assets = release['assets']
          assert len(assets) == 1 and assets[0]['name'] == filename.name
          assert assets[0]['size'] == expected_size
          assert assets[0]['digest'] == 'sha256:' + expected_sha, 'Uploaded asset digest mismatch'
          if release['draft']:
              latest = subprocess.run(['gh', 'api', api_path + '/latest'], capture_output=True, text=True)
              if latest.returncode == 0:
                  latest_tag = json.loads(latest.stdout)['tag_name']
                  assert not latest_tag.startswith('v1.0.0-') or int(latest_tag.rsplit('-', 1)[1]) <= 25, 'A newer APK is already published'
              else:
                  assert '404' in latest.stderr, 'Could not check latest release'
              payload = Path('publish.json')
              payload.write_text(json.dumps({'draft': False, 'make_latest': 'true'}))
              subprocess.run(['gh', 'api', '--method', 'PATCH', release_path, '--input', str(payload)], check=True)
          print('Verified published APK: ' + tag)
          PY
